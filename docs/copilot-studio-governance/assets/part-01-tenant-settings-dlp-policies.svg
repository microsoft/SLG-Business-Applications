    <g transform="translate(1204 64) rotate(10)">
      <rect width="107" height="107" rx="28" fill="url(#cubeBlue)"/>
      <path d="M0 28Q0 0 28 0H79Q107 0 107 28V47Q75 57 0 41Z" fill="#72adf7" opacity="0.62"/>
    </g>
    <g transform="translate(1260 519) rotate(-9)">
